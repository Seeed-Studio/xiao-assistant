  code: "// DC Motor with H-Bridge (L298N) - XIAO\n#define IN1_PIN 2    // Motor direction pin 1\n#define IN2_PIN 3    // Motor direction pin 2\n#define ENA_PIN 4    // PWM speed control (enable)\n\nvoid\
    \ setup() {\n  Serial.begin(115200);\n  while (!Serial) { delay(10); }\n\n  pinMode(IN1_PIN, OUTPUT);\n  pinMode(IN2_PIN, OUTPUT);\n  pinMode(ENA_PIN, OUTPUT);\n\n  Serial.println(\"DC Motor H-Bridge\
    \ example\");\n  Serial.println(\"Forward -> Reverse -> Stop cycle\");\n}\n\nvoid setMotor(int speed) {\n  // speed: -255 to 255 (negative = reverse)\n  if (speed > 0) {\n    digitalWrite(IN1_PIN, HIGH);\n\
    \    digitalWrite(IN2_PIN, LOW);\n  } else if (speed < 0) {\n    digitalWrite(IN1_PIN, LOW);\n    digitalWrite(IN2_PIN, HIGH);\n  } else {\n    digitalWrite(IN1_PIN, LOW);\n    digitalWrite(IN2_PIN,\
    \ LOW);\n  }\n  analogWrite(ENA_PIN, abs(speed));\n}\n\nvoid loop() {\n  // Forward, increasing speed\n  Serial.println(\"Forward - ramping up\");\n  for (int s = 0; s <= 255; s += 5) {\n    setMotor(s);\n\
    \    delay(50);\n  }\n  delay(1000);\n\n  // Reverse, decreasing speed\n  Serial.println(\"Reverse - ramping down\");\n  for (int s = 255; s >= -255; s -= 5) {\n    setMotor(s);\n    delay(50);\n  }\n\
    \  delay(1000);\n\n  // Stop\n  Serial.println(\"Stop\");\n  setMotor(0);\n  delay(2000);\n}\n"
  requirements: []
  wikiUrl: https://wiki.seeedstudio.com/SeeedStudio_XIAO_Series_Introduction/
