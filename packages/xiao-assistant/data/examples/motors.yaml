  code: "// Stepper Motor Control (28BYJ-48 + ULN2003) - XIAO\n#include <Stepper.h>\n\n// 28BYJ-48 has 2048 steps per revolution (with gear reduction)\n#define STEPS_PER_REV 2048\n\n// IN1-IN3-IN2-IN4 wiring\
    \ order for ULN2003\nStepper myStepper(STEPS_PER_REV, 2, 4, 3, 5);\n\nvoid setup() {\n  Serial.begin(115200);\n  while (!Serial) { delay(10); }\n\n  myStepper.setSpeed(10);  // 10 RPM\n  Serial.println(\"\
    Stepper motor example\");\n  Serial.println(\"Connect 28BYJ-48 via ULN2003 to pins 2,3,4,5\");\n}\n\nvoid loop() {\n  // Rotate clockwise one full revolution\n  Serial.println(\"Clockwise 1 revolution...\"\
    );\n  myStepper.step(STEPS_PER_REV);\n  delay(1000);\n\n  // Rotate counter-clockwise one full revolution\n  Serial.println(\"Counter-clockwise 1 revolution...\");\n  myStepper.step(-STEPS_PER_REV);\n\
    \  delay(1000);\n\n  // Rotate 90 degrees clockwise\n  Serial.println(\"Clockwise 90 degrees...\");\n  myStepper.step(STEPS_PER_REV / 4);\n  delay(1000);\n\n  // Rotate 90 degrees counter-clockwise\n\
    \  Serial.println(\"Counter-clockwise 90 degrees...\");\n  myStepper.step(-STEPS_PER_REV / 4);\n  delay(1000);\n}\n"
  requirements: []
  wikiUrl: https://wiki.seeedstudio.com/SeeedStudio_XIAO_Series_Introduction/
- id: dc-motor-hbridge-arduino
  title: DC Motor with H-Bridge
  description: Control a DC motor's speed and direction using an L298N H-Bridge driver
