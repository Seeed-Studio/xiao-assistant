  code: "// Servo Motor Control - XIAO\n// Sweep a servo motor from 0 to 180 degrees and back\n#include <Servo.h>\n\n#define SERVO_PIN 3\n\nServo myServo;\nint angle = 0;\nint step = 1;\n\nvoid setup()\
    \ {\n  Serial.begin(115200);\n  while (!Serial) { delay(10); }\n\n  myServo.attach(SERVO_PIN);\n  myServo.write(0);\n  Serial.println(\"Servo sweep example\");\n  Serial.println(\"Connect servo signal\
    \ wire to pin 3\");\n}\n\nvoid loop() {\n  myServo.write(angle);\n  Serial.print(\"Angle: \"); Serial.print(angle); Serial.println(\" degrees\");\n\n  angle += step;\n  if (angle >= 180 || angle <=\
    \ 0) {\n    step = -step;\n  }\n\n  delay(15);  // Allow servo to reach position\n}\n"
  requirements:
  - Servo
  wikiUrl: https://wiki.seeedstudio.com/SeeedStudio_XIAO_Series_Introduction/
