  code: "// PWM Fan Control - XIAO\n// Adjusts fan speed based on simulated temperature\n#define FAN_PWM_PIN 3    // 4-pin fan PWM control wire\n#define FAN_TACH_PIN 2   // Tachometer input (optional)\n\
    #define TEMP_SENSOR A0   // Temperature sensor analog input\n\nvolatile unsigned long tachCount = 0;\n\nvoid tachISR() {\n  tachCount++;\n}\n\nvoid setup() {\n  Serial.begin(115200);\n  while (!Serial)\
    \ { delay(10); }\n\n  pinMode(FAN_PWM_PIN, OUTPUT);\n  pinMode(FAN_TACH_PIN, INPUT_PULLUP);\n  attachInterrupt(digitalPinToInterrupt(FAN_TACH_PIN), tachISR, FALLING);\n\n  Serial.println(\"PWM Fan Control\
    \ Example\");\n  Serial.println(\"Connect 4-pin fan PWM to pin 3\");\n}\n\nint temperatureToFanSpeed(float tempC) {\n  // Map temperature to fan speed\n  // Below 25C: fan off\n  // 25-50C: linear ramp\
    \ 0-255\n  if (tempC < 25.0) return 0;\n  if (tempC > 50.0) return 255;\n  return (int)((tempC - 25.0) / 25.0 * 255);\n}\n\nvoid loop() {\n  // Read temperature (replace with real sensor)\n  int raw\
    \ = analogRead(TEMP_SENSOR);\n  // Simulated temperature for demonstration\n  float tempC = 20.0 + (raw / 4095.0) * 40.0;\n\n  int fanSpeed = temperatureToFanSpeed(tempC);\n  analogWrite(FAN_PWM_PIN,\
    \ fanSpeed);\n\n  // Calculate RPM (tach pulses per revolution = 2 for most fans)\n  unsigned long count = tachCount;\n  tachCount = 0;\n  int rpm = (count / 2) * 60;  // Convert to RPM over 1 second\n\
    \n  Serial.print(\"Temp: \"); Serial.print(tempC, 1); Serial.print(\" C | Fan: \"); Serial.print(fanSpeed); Serial.print(\"/255 | RPM: \"); Serial.print(rpm); Serial.println();\n\n  delay(1000);\n}\n"
  requirements: []
  wikiUrl: https://wiki.seeedstudio.com/SeeedStudio_XIAO_Series_Introduction/
