- id: light-sleep-esp32-arduino
  title: Light Sleep with GPIO Wake
  description: Enter light sleep mode and wake on a GPIO interrupt
  language: arduino
  boards:
  - esp32c3
  - esp32s3
  - esp32s3-sense
  - esp32c6
  category: power
  tags:
  - light sleep
  - low power
  - gpio
  - wake
  - interrupt
  - esp32
  - energy saving
  code: "// Light Sleep with GPIO Wake - XIAO ESP32 Series\n// Wake from light sleep when a button is pressed on GPIO 0\n#include \"driver/rtc_io.h\"\n\n#define WAKE_PIN 0     // GPIO pin to wake from sleep\n\
    #define uS_TO_S 1000000ULL\n\nRTC_DATA_ATTR int bootCount = 0;\n\nvoid setup() {\n  Serial.begin(115200);\n  delay(1000);\n\n  bootCount++;\n  Serial.print(\"Boot count: \"); Serial.print(bootCount);\
    \ Serial.println();\n\n  // Configure wake pin\n  pinMode(WAKE_PIN, INPUT_PULLUP);\n\n  // Configure ESP32 to wake on GPIO (active low)\n  esp_sleep_enable_ext0_wakeup((gpio_num_t)WAKE_PIN, 0);\n\n\
    \  // Also set a timer wake as backup (60 seconds)\n  esp_sleep_enable_timer_wakeup(60 * uS_TO_S);\n\n  Serial.println(\"Entering light sleep...\");\n  Serial.println(\"Press button on pin 0 or wait\
    \ 60s to wake\");\n  delay(100);\n\n  esp_light_sleep_start();\n\n  // Code continues here after waking\n  esp_sleep_wakeup_cause_t cause = esp_sleep_get_wakeup_cause();\n  switch (cause) {\n    case\
    \ ESP_SLEEP_WAKEUP_EXT0:\n      Serial.println(\"Woke up from GPIO button press\");\n      break;\n    case ESP_SLEEP_WAKEUP_TIMER:\n      Serial.println(\"Woke up from timer\");\n      break;\n   \
    \ default:\n      Serial.print(\"Wakeup cause: \"); Serial.print(cause); Serial.println();\n      break;\n  }\n}\n\nvoid loop() {\n  Serial.println(\"Awake! Doing work...\");\n  delay(5000);\n  Serial.println(\"\
    Going back to sleep...\");\n  esp_light_sleep_start();\n}\n"
  requirements: []
  wikiUrl: https://wiki.seeedstudio.com/XIAO_ESP32C3_Getting_Started/
- id: battery-monitor-arduino
  title: Battery Voltage Monitor
  description: Monitor the battery voltage on XIAO boards with built-in battery support
  language: arduino
