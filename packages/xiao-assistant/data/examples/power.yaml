  - power
  - lipo
  - charging
  - adc
  code: "// Battery Voltage Monitor - XIAO\n// Reads battery voltage through the voltage divider on XIAO boards\n// Note: Only works when powered by battery, not USB\n\n#define BATT_ADC_PIN A0  // Battery\
    \ voltage divider pin\n#define ADC_RESOLUTION 4095.0\n#define ADC_REF_VOLTAGE 3.3\n#define VOLTAGE_DIVIDER_RATIO 2.0  // Board has a 1:1 voltage divider\n\n// Battery level thresholds (single-cell LiPo)\n\
    #define BATT_FULL   4.2\n#define BATT_EMPTY  3.3\n#define BATT_LOW    3.5\n#define BATT_CUTOFF 3.2\n\nfloat readBatteryVoltage() {\n  long sum = 0;\n  for (int i = 0; i < 16; i++) {\n    sum += analogRead(BATT_ADC_PIN);\n\
    \    delay(5);\n  }\n  float avgReading = sum / 16.0;\n  float voltage = (avgReading / ADC_RESOLUTION) * ADC_REF_VOLTAGE * VOLTAGE_DIVIDER_RATIO;\n  return voltage;\n}\n\nint voltageToPercent(float\
    \ voltage) {\n  if (voltage >= BATT_FULL) return 100;\n  if (voltage <= BATT_EMPTY) return 0;\n  return (int)((voltage - BATT_EMPTY) / (BATT_FULL - BATT_EMPTY) * 100);\n}\n\nvoid setup() {\n  Serial.begin(115200);\n\
    \  while (!Serial) { delay(10); }\n  Serial.println(\"Battery Voltage Monitor\");\n  analogReadResolution(12);  // Set to 12-bit ADC for ESP32\n}\n\nvoid loop() {\n  float voltage = readBatteryVoltage();\n\
    \  int percent = voltageToPercent(voltage);\n\n  Serial.print(\"Battery: \"); Serial.print(voltage, 2); Serial.print(\" V (\"); Serial.print(percent); Serial.print(\"%\"); Serial.println(\")\");\n\n\
    \  if (voltage < BATT_CUTOFF) {\n    Serial.println(\"WARNING: Battery critically low! Shutting down...\");\n    // esp_deep_sleep_start(); // Uncomment to auto-shutdown\n  } else if (voltage < BATT_LOW)\
    \ {\n    Serial.println(\"Low battery warning!\");\n  }\n\n  delay(10000);\n}\n"
  requirements: []
  wikiUrl: https://wiki.seeedstudio.com/SeeedStudio_XIAO_Series_Introduction/
- id: solar-charging-arduino
  title: Solar Charging Monitor
  description: Monitor a solar panel's voltage and current to track charging performance
