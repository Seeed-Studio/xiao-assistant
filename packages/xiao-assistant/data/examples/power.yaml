  code: "// Solar Charging Monitor - XIAO\n// Monitors solar panel voltage and battery charge state\n#define SOLAR_ADC A0    // Solar panel voltage (via voltage divider)\n#define BATT_ADC  A1    // Battery\
    \ voltage (via voltage divider)\n#define CURRENT_ADC A2  // ACS712 current sensor output\n\n#define VDIV_RATIO 3.0  // Voltage divider ratio (adjust to your circuit)\n#define ADC_MAX 4095.0\n#define\
    \ VREF 3.3\n\nunsigned long lastUpdate = 0;\nfloat totalEnergy = 0;  // Wh accumulated\n\nfloat readVoltage(int pin, float ratio) {\n  long sum = 0;\n  for (int i = 0; i < 8; i++) {\n    sum += analogRead(pin);\n\
    \    delay(2);\n  }\n  return (sum / 8.0 / ADC_MAX) * VREF * ratio;\n}\n\nfloat readCurrent() {\n  // ACS712-5A: 185 mV/A, midpoint at 2.5V\n  float voltage = readVoltage(CURRENT_ADC, 1.0);\n  return\
    \ (voltage - 2.5) / 0.185;\n}\n\nvoid setup() {\n  Serial.begin(115200);\n  while (!Serial) { delay(10); }\n\n  analogReadResolution(12);\n  Serial.println(\"Solar Charging Monitor\");\n  Serial.println(\"\
    Time | Solar V | Batt V | Current | Power | Energy\");\n}\n\nvoid loop() {\n  float solarV = readVoltage(SOLAR_ADC, VDIV_RATIO);\n  float battV = readVoltage(BATT_ADC, VDIV_RATIO);\n  float current\
    \ = readCurrent();\n  if (current < 0) current = 0;  // Ignore negative current\n\n  float power = battV * current;  // Watts\n\n  // Accumulate energy (Wh) over 1-second intervals\n  unsigned long\
    \ now = millis();\n  if (lastUpdate > 0) {\n    float hours = (now - lastUpdate) / 3600000.0;\n    totalEnergy += power * hours;\n  }\n  lastUpdate = now;\n\n  Serial.print(now / 1000); Serial.print(\"\
    s | \"); Serial.print(solarV, 2); Serial.print(\"V | \"); Serial.print(battV, 2); Serial.print(\"V | \"); Serial.print(current, 2); Serial.print(\"A | \"); Serial.print(power, 2); Serial.print(\"W |\
    \ \"); Serial.print(totalEnergy, 3); Serial.println(\"Wh\");\n\n  delay(1000);\n}\n"
  requirements: []
  wikiUrl: https://wiki.seeedstudio.com/SeeedStudio_XIAO_Series_Introduction/
