- id: camera-timelapse-arduino
  title: Camera Timelapse
  description: Capture images at regular intervals and save timestamps for timelapse
  language: arduino
  boards:
  - esp32s3-sense
  category: camera
  tags:
  - camera
  - timelapse
  - interval
  - capture
  - scheduled
  - photography
  code: "// Camera Timelapse - XIAO ESP32S3 Sense\n// Captures images at regular intervals with SD card storage\n#include \"esp_camera.h\"\n#include <camera_pins.h>\n#include <SD.h>\n#include <SPI.h>\n\n\
    #define CAPTURE_INTERVAL_MS 10000  // Capture every 10 seconds\n#define SD_CS_PIN 2\n\n// Camera pin definitions (XIAO ESP32S3 Sense)\n#define PWDN_GPIO_NUM  -1\n#define RESET_GPIO_NUM -1\n#define XCLK_GPIO_NUM\
    \  10\n#define SIOD_GPIO_NUM  40\n#define SIOC_GPIO_NUM  39\n#define Y9_GPIO_NUM    15\n#define Y8_GPIO_NUM    16\n#define Y7_GPIO_NUM    18\n#define Y6_GPIO_NUM    12\n#define Y5_GPIO_NUM    17\n#define\
    \ Y4_GPIO_NUM    23\n#define Y3_GPIO_NUM    4\n#define Y2_GPIO_NUM    5\n#define VSYNC_GPIO_NUM 6\n#define HREF_GPIO_NUM  7\n#define PCLK_GPIO_NUM  13\n\nunsigned long captureCount = 0;\n\nbool initCamera()\
    \ {\n  camera_config_t config;\n  config.ledc_channel = LEDC_CHANNEL_0;\n  config.ledc_timer = LEDC_TIMER_0;\n  config.pin_d0 = Y2_GPIO_NUM;\n  config.pin_d1 = Y3_GPIO_NUM;\n  config.pin_d2 = Y4_GPIO_NUM;\n\
    \  config.pin_d3 = Y5_GPIO_NUM;\n  config.pin_d4 = Y6_GPIO_NUM;\n  config.pin_d5 = Y7_GPIO_NUM;\n  config.pin_d6 = Y8_GPIO_NUM;\n  config.pin_d7 = Y9_GPIO_NUM;\n  config.pin_xclk = XCLK_GPIO_NUM;\n\
    \  config.pin_pclk = PCLK_GPIO_NUM;\n  config.pin_vsync = VSYNC_GPIO_NUM;\n  config.pin_href = HREF_GPIO_NUM;\n  config.pin_sccb_sda = SIOD_GPIO_NUM;\n  config.pin_sccb_scl = SIOC_GPIO_NUM;\n  config.pin_pwdn\
    \ = PWDN_GPIO_NUM;\n  config.pin_reset = RESET_GPIO_NUM;\n  config.xclk_freq_hz = 20000000;\n  config.pixel_format = PIXFORMAT_JPEG;\n  config.frame_size = FRAMESIZE_SVGA;\n  config.jpeg_quality = 10;\n\
    \  config.fb_count = 2;\n  return esp_camera_init(&config) == ESP_OK;\n}\n\nvoid setup() {\n  Serial.begin(115200);\n  while (!Serial) { delay(10); }\n\n  if (!initCamera()) {\n    Serial.println(\"\
    Camera init failed!\");\n    while (1);\n  }\n  Serial.println(\"Camera ready\");\n\n  if (!SD.begin(SD_CS_PIN)) {\n    Serial.println(\"SD card mount failed! Running in serial-only mode.\");\n  } else\
    \ {\n    Serial.print(\"SD card ready. Capacity: \"); Serial.print(SD.cardSize());  Serial.println(\" bytes\");\n  }\n\n  // Create directory for this session\n  String dir = \"/timelapse_\" + String(millis());\n\
    \  SD.mkdir(dir.c_str());\n  Serial.print(\"Saving to: \"); Serial.print(dir.c_str());  Serial.println();\n}\n\nvoid loop() {\n  static unsigned long lastCapture = 0;\n\n  if (millis() - lastCapture\
    \ >= CAPTURE_INTERVAL_MS) {\n    lastCapture = millis();\n    captureCount++;\n\n    camera_fb_t *fb = esp_camera_fb_get();\n    if (!fb) {\n      Serial.println(\"Capture failed\");\n      return;\n\
    \    }\n\n    // Save to SD card\n    String filename = \"/timelapse_\" + String(millis() / 1000) + \".jpg\";\n    File file = SD.open(filename.c_str(), FILE_WRITE);\n    if (file) {\n      file.write(fb->buf,\
    \ fb->len);\n      file.close();\n      Serial.print(\"[\"); Serial.print(captureCount); Serial.print(\"] Saved \"); Serial.print(filename.c_str());  Serial.print(\" (\"); Serial.print(fb->len); Serial.println(\"\
    \ bytes)\");\n    } else {\n      Serial.print(\"[\"); Serial.print(captureCount); Serial.print(\"] SD write failed, image size: \"); Serial.print(fb->len); Serial.println(\" bytes\");\n    }\n\n  \
    \  esp_camera_fb_return(fb);\n  }\n}\n"
  requirements: []
  wikiUrl: https://wiki.seeedstudio.com/XIAO_ESP32S3_Sense_Getting_Started/
