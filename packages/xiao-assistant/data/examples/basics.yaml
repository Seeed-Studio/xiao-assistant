  - ra4m1
  - mg24
  - mg24-sense
  category: basics
  tags:
  - button
  - debounce
  - digital input
  - gpio
  - switch
  code: "// Button Debounce - XIAO\n// Reads a push button with software debounce\n\n#define BUTTON_PIN 0     // Connect button between this pin and GND\n#define DEBOUNCE_MS 50   // Debounce time in milliseconds\n\
    \nbool lastStableState = HIGH;\nbool lastReading = HIGH;\nunsigned long lastDebounceTime = 0;\n\nvoid setup() {\n  Serial.begin(115200);\n  while (!Serial) { delay(10); }\n  pinMode(BUTTON_PIN, INPUT_PULLUP);\n\
    \  Serial.println(\"Button debounce example ready\");\n}\n\nvoid loop() {\n  bool reading = digitalRead(BUTTON_PIN);\n\n  if (reading != lastReading) {\n    lastDebounceTime = millis();\n  }\n\n  if\
    \ ((millis() - lastDebounceTime) > DEBOUNCE_MS) {\n    if (reading != lastStableState) {\n      lastStableState = reading;\n      if (lastStableState == LOW) {\n        Serial.println(\"Button pressed!\"\
    );\n      } else {\n        Serial.println(\"Button released!\");\n      }\n    }\n  }\n\n  lastReading = reading;\n}\n"
  requirements: []
  wikiUrl: https://wiki.seeedstudio.com/SeeedStudio_XIAO_Series_Introduction/
