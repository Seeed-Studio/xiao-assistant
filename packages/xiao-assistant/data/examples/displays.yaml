  code: "// TFT Sprite Animation - XIAO\n// Uses TFT_eSPI sprites for flicker-free animation\n#include <TFT_eSPI.h>\n#include <SPI.h>\n\nTFT_eSPI tft = TFT_eSPI();\nTFT_eSprite sprite = TFT_eSprite(&tft);\n\
    \nint ballX = 60, ballY = 60;\nint velX = 2, velY = 1;\nint ballRadius = 8;\nint screenWidth = 240, screenHeight = 240;\n\nvoid setup() {\n  Serial.begin(115200);\n  tft.init();\n  tft.setRotation(2);\n\
    \  tft.fillScreen(TFT_BLACK);\n\n  sprite.createSprite(screenWidth, screenHeight);\n}\n\nvoid loop() {\n  // Update ball position\n  ballX += velX;\n  ballY += velY;\n\n  // Bounce off walls\n  if (ballX\
    \ <= ballRadius || ballX >= screenWidth - ballRadius) velX = -velX;\n  if (ballY <= ballRadius || ballY >= screenHeight - ballRadius) velY = -velY;\n\n  // Draw to sprite (offscreen buffer)\n  sprite.fillSprite(TFT_BLACK);\n\
    \n  // Draw trail\n  for (int i = 3; i > 0; i--) {\n    int trailX = ballX - velX * i;\n    int trailY = ballY - velY * i;\n    uint16_t color = tft.color565(50 * i, 0, 100 * i);\n    sprite.fillCircle(trailX,\
    \ trailY, ballRadius - i, color);\n  }\n\n  // Draw ball\n  sprite.fillCircle(ballX, ballY, ballRadius, TFT_GREEN);\n\n  // Push sprite to display\n  sprite.pushSprite(0, 0);\n\n  delay(20);\n}\n"
  requirements:
  - TFT_eSPI
  wikiUrl: https://wiki.seeedstudio.com/SeeedStudio_XIAO_Series_Introduction/
