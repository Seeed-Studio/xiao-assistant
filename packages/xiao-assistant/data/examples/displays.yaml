  code: "// OLED Real-Time Graph - XIAO\n#include <Adafruit_GFX.h>\n#include <Adafruit_SSD1306.h>\n#include <Wire.h>\n\n#define SCREEN_WIDTH 128\n#define SCREEN_HEIGHT 64\n\nAdafruit_SSD1306 display(SCREEN_WIDTH,\
    \ SCREEN_HEIGHT, &Wire, -1);\n\nint graphData[SCREEN_WIDTH];  // One data point per pixel column\nint dataIndex = 0;\n\nvoid setup() {\n  Serial.begin(115200);\n  while (!Serial) { delay(10); }\n\n\
    \  if (!display.begin(SSD1306_SWITCHCAPVCC, 0x3C)) {\n    Serial.println(\"SSD1306 init failed\");\n    while (1);\n  }\n\n  memset(graphData, 0, sizeof(graphData));\n  display.clearDisplay();\n  display.display();\n\
    }\n\nvoid drawGraph() {\n  display.clearDisplay();\n\n  // Draw border\n  display.drawRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT, SSD1306_WHITE);\n\n  // Draw graph\n  for (int i = 1; i < SCREEN_WIDTH;\
    \ i++) {\n    int prev = constrain(graphData[i - 1], 0, SCREEN_HEIGHT - 2);\n    int curr = constrain(graphData[i], 0, SCREEN_HEIGHT - 2);\n    display.drawLine(i - 1, SCREEN_HEIGHT - 1 - prev,\n  \
    \                  i, SCREEN_HEIGHT - 1 - curr, SSD1306_WHITE);\n  }\n\n  // Show current value\n  display.setTextSize(1);\n  display.setCursor(2, 2);\n  display.printf(\"Val:%d\", graphData[dataIndex]);\n\
    \n  display.display();\n}\n\nvoid loop() {\n  // Simulate sensor data (replace with real sensor reading)\n  int value = random(10, 55);\n  graphData[dataIndex] = value;\n  dataIndex = (dataIndex + 1)\
    \ % SCREEN_WIDTH;\n\n  drawGraph();\n  delay(100);\n}\n"
  requirements:
  - Adafruit SSD1306
  - Adafruit GFX Library
  wikiUrl: https://wiki.seeedstudio.com/SeeedStudio_XIAO_Series_Introduction/
