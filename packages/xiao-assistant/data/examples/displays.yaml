  code: "// ST7789 TFT Display - XIAO\n#include <Adafruit_GFX.h>\n#include <Adafruit_ST7789.h>\n#include <SPI.h>\n\n#define TFT_CS    1     // Chip select\n#define TFT_DC    3     // Data/Command\n#define\
    \ TFT_RST   2     // Reset\n#define TFT_BL    4     // Backlight (optional)\n\nAdafruit_ST7789 tft = Adafruit_ST7789(TFT_CS, TFT_DC, TFT_RST);\n\nvoid setup() {\n  Serial.begin(115200);\n\n  tft.init(240,\
    \ 240);  // Initialize with 240x240 resolution\n  tft.setRotation(2);\n  tft.fillScreen(ST77XX_BLACK);\n\n  // Draw text\n  tft.setTextSize(2);\n  tft.setTextColor(ST77XX_WHITE);\n  tft.setCursor(20,\
    \ 30);\n  tft.println(\"XIAO\");\n\n  tft.setTextSize(1);\n  tft.setTextColor(ST77XX_GREEN);\n  tft.setCursor(20, 70);\n  tft.println(\"ST7789 TFT Display\");\n\n  // Draw some shapes\n  tft.drawRect(10,\
    \ 10, 220, 220, ST77XX_BLUE);\n  tft.fillCircle(120, 150, 30, ST77XX_RED);\n\n  Serial.println(\"Display initialized\");\n}\n\nvoid loop() {\n  // Update display here\n  delay(1000);\n}\n"
  requirements:
  - Adafruit ST7789 and GFX Library
  - Adafruit GFX Library
