  code: "// E-Paper Display (1.54 inch, 200x200) - XIAO\n#include <GxEPD2_BW.h>\n#include <Adafruit_GFX.h>\n#include <SPI.h>\n\n#define CS_PIN   1\n#define DC_PIN   3\n#define RST_PIN  2\n#define BUSY_PIN\
    \ 0\n\n// 1.54 inch, 200x200, SSD1681 controller\nGxEPD2_BW<GxEPD2_154_GDEY0154D67, GxEPD2_154_GDEY0154D67::HEIGHT>\n  display(GxEPD2_154_GDEY0154D67(CS_PIN, DC_PIN, RST_PIN, BUSY_PIN));\n\nvoid setup()\
    \ {\n  Serial.begin(115200);\n  display.init(115200, true, 2, false);\n\n  display.setRotation(1);\n  display.setFullWindow();\n\n  display.firstPage();\n  do {\n    display.fillScreen(GxEPD_WHITE);\n\
    \    display.setTextColor(GxEPD_BLACK);\n    display.setTextSize(2);\n    display.setCursor(30, 80);\n    display.print(\"XIAO\");\n    display.setTextSize(1);\n    display.setCursor(30, 120);\n   \
    \ display.print(\"E-Paper Display\");\n  } while (display.nextPage());\n\n  Serial.println(\"E-Paper display initialized\");\n  display.hibernate();  // Save power\n}\n\nvoid loop() {\n  // E-Paper\
    \ retains the image even with no power\n  delay(10000);\n}\n"
  requirements:
  - GxEPD2
  wikiUrl: https://wiki.seeedstudio.com/SeeedStudio_XIAO_Series_Introduction/
