  code: "// LCD1602 with I2C Backpack - XIAO\n#include <Wire.h>\n#include <LiquidCrystal_I2C.h>\n\n// I2C address is usually 0x27 or 0x3F\nLiquidCrystal_I2C lcd(0x27, 16, 2);\n\nvoid setup() {\n  Serial.begin(115200);\n\
    \n  lcd.init();\n  lcd.backlight();\n\n  // Display on line 1\n  lcd.setCursor(0, 0);\n  lcd.print(\"XIAO Board\");\n  // Display on line 2\n  lcd.setCursor(0, 1);\n  lcd.print(\"Hello World!\");\n\n\
    \  Serial.println(\"LCD1602 initialized\");\n}\n\nvoid loop() {\n  // Scroll text demonstration\n  for (int i = 0; i < 13; i++) {\n    lcd.scrollDisplayLeft();\n    delay(300);\n  }\n  for (int i =\
    \ 0; i < 26; i++) {\n    lcd.scrollDisplayRight();\n    delay(300);\n  }\n  for (int i = 0; i < 13; i++) {\n    lcd.scrollDisplayLeft();\n    delay(300);\n  }\n  delay(1000);\n}\n"
  requirements:
  - LiquidCrystal I2C
  wikiUrl: https://wiki.seeedstudio.com/SeeedStudio_XIAO_Series_Introduction/
