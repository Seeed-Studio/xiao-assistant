  code: "// PWM Servo at 50Hz using LEDC - XIAO ESP32\n// Hardware PWM for precise servo control without Servo library\n#include <driver/ledc.h>\n\n#define SERVO_PIN     3\n#define SERVO_CHANNEL LEDC_CHANNEL_0\n\
    #define SERVO_TIMER   LEDC_TIMER_0\n#define PWM_FREQ      50      // 50 Hz for standard servos\n#define PWM_BITS      16      // 16-bit resolution\n\n// Servo pulse width limits (in microseconds)\n\
    #define MIN_PULSE_US  500     // 0 degrees\n#define MAX_PULSE_US  2500    // 180 degrees\n#define PERIOD_US     20000   // 20ms = 50Hz\n\nvoid setServoAngle(int angle) {\n  angle = constrain(angle,\
    \ 0, 180);\n\n  // Map angle to pulse width\n  int pulseUs = map(angle, 0, 180, MIN_PULSE_US, MAX_PULSE_US);\n\n  // Convert pulse width to duty cycle (16-bit)\n  uint32_t duty = (uint32_t)((float)pulseUs\
    \ / PERIOD_US * 65535);\n\n  ledc_set_duty(LEDC_HIGH_SPEED_MODE, SERVO_CHANNEL, duty);\n  ledc_update_duty(LEDC_HIGH_SPEED_MODE, SERVO_CHANNEL);\n\n  Serial.print(\"Angle: \"); Serial.print(angle);\
    \ Serial.print(\" | Pulse: \"); Serial.print(pulseUs); Serial.print(\" us | Duty: \"); Serial.print(duty); Serial.println();\n}\n\nvoid setup() {\n  Serial.begin(115200);\n  while (!Serial) { delay(10);\
    \ }\n\n  // Configure LEDC timer\n  ledc_timer_config_t timer_conf = {\n    .speed_mode = LEDC_HIGH_SPEED_MODE,\n    .duty_resolution = LEDC_TIMER_16_BIT,\n    .timer_num = SERVO_TIMER,\n    .freq_hz\
    \ = PWM_FREQ,\n    .clk_cfg = LEDC_AUTO_CLK\n  };\n  ledc_timer_config(&timer_conf);\n\n  // Configure LEDC channel\n  ledc_channel_config_t channel_conf = {\n    .gpio_num = SERVO_PIN,\n    .speed_mode\
    \ = LEDC_HIGH_SPEED_MODE,\n    .channel = SERVO_CHANNEL,\n    .timer_sel = SERVO_TIMER,\n    .duty = 0,\n    .hpoint = 0\n  };\n  ledc_channel_config(&channel_conf);\n\n  Serial.println(\"LEDC Servo\
    \ Control (50Hz)\");\n  Serial.println(\"Hardware PWM for precise timing\");\n}\n\nvoid loop() {\n  // Sweep from 0 to 180\n  for (int angle = 0; angle <= 180; angle += 5) {\n    setServoAngle(angle);\n\
    \    delay(50);\n  }\n  delay(500);\n\n  // Sweep from 180 to 0\n  for (int angle = 180; angle >= 0; angle -= 5) {\n    setServoAngle(angle);\n    delay(50);\n  }\n  delay(500);\n}\n"
