  code: "// Dual-Core Task - XIAO ESP32S3\n// Runs sensor reading on Core 0, communication on Core 1\n#include <freertos/FreeRTOS.h>\n#include <freertos/task.h>\n\nTaskHandle_t sensorTaskHandle;\nTaskHandle_t\
    \ commTaskHandle;\n\nvolatile float sharedTemperature = 0.0;\nvolatile float sharedHumidity = 0.0;\nSemaphoreHandle_t dataMutex;\n\n// Sensor task - runs on Core 0\nvoid sensorTask(void *parameter)\
    \ {\n  Serial.print(\"Sensor task on core \"); Serial.print(xPortGetCoreID());  Serial.println();\n\n  while (true) {\n    // Simulate sensor reading\n    float temp = 22.0 + random(-200, 200) / 100.0;\n\
    \    float hum = 55.0 + random(-500, 500) / 100.0;\n\n    if (xSemaphoreTake(dataMutex, portMAX_DELAY)) {\n      sharedTemperature = temp;\n      sharedHumidity = hum;\n      xSemaphoreGive(dataMutex);\n\
    \    }\n\n    vTaskDelay(pdMS_TO_TICKS(1000));\n  }\n}\n\n// Communication task - runs on Core 1\nvoid commTask(void *parameter) {\n  Serial.print(\"Comm task on core \"); Serial.print(xPortGetCoreID());\
    \  Serial.println();\n\n  while (true) {\n    float temp, hum;\n    if (xSemaphoreTake(dataMutex, portMAX_DELAY)) {\n      temp = sharedTemperature;\n      hum = sharedHumidity;\n      xSemaphoreGive(dataMutex);\n\
    \    }\n\n    Serial.print(\"[Core1] Temp: \"); Serial.print(temp, 1); Serial.print(\" C, Humidity: \"); Serial.print(hum, 1); Serial.print(\" \"); Serial.print(\"%\"); Serial.println();\n    // Here\
    \ you would send data via WiFi, BLE, etc.\n\n    vTaskDelay(pdMS_TO_TICKS(3000));\n  }\n}\n\nvoid setup() {\n  Serial.begin(115200);\n  while (!Serial) { delay(10); }\n\n  dataMutex = xSemaphoreCreateMutex();\n\
    \n  // Create tasks on specific cores\n  xTaskCreatePinnedToCore(sensorTask, \"Sensor\", 4096, NULL, 1, &sensorTaskHandle, 0);\n  xTaskCreatePinnedToCore(commTask, \"Comm\", 4096, NULL, 1, &commTaskHandle,\
    \ 1);\n\n  Serial.println(\"Dual-core tasks started\");\n}\n\nvoid loop() {\n  // Main loop runs on Core 1 by default\n  // Can do housekeeping here or just yield\n  delay(1000);\n}\n"
