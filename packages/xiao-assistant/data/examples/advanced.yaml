  code: "// DMA ADC Transfer - XIAO ESP32 Series\n// High-speed ADC sampling using I2S DMA\n#include <driver/i2s.h>\n\n#define ADC_PIN        A0\n#define SAMPLE_RATE    10000\n#define BUFFER_SAMPLES 256\n\
    \nuint16_t adcBuffer[BUFFER_SAMPLES];\nTaskHandle_t processTaskHandle;\n\nvoid IRAM_ATTR onI2SEvent(void *arg) {\n  // Notify processing task when buffer is ready\n  BaseType_t xHigherPriorityTaskWoken\
    \ = pdFALSE;\n  vTaskNotifyGiveFromISR(processTaskHandle, &xHigherPriorityTaskWoken);\n  if (xHigherPriorityTaskWoken) portYIELD_FROM_ISR();\n}\n\nvoid processTask(void *parameter) {\n  while (true)\
    \ {\n    ulTaskNotifyTake(pdTRUE, portMAX_DELAY);\n\n    // Process the DMA buffer\n    uint32_t sum = 0;\n    uint16_t minVal = 4095, maxVal = 0;\n\n    for (int i = 0; i < BUFFER_SAMPLES; i++) {\n\
    \      sum += adcBuffer[i];\n      if (adcBuffer[i] < minVal) minVal = adcBuffer[i];\n      if (adcBuffer[i] > maxVal) maxVal = adcBuffer[i];\n    }\n\n    float avg = (float)sum / BUFFER_SAMPLES;\n\
    \    float voltage = avg * (3.3 / 4095.0);\n    int ppAmplitude = maxVal - minVal;\n\n    Serial.print(\"Avg: \"); Serial.print(avg, 1); Serial.print(\" (\"); Serial.print(voltage, 3); Serial.print(\"\
    \ V) | Peak-Peak: \"); Serial.print(ppAmplitude); Serial.print(\" | Min: \"); Serial.print(minVal); Serial.print(\" Max: \"); Serial.print(maxVal); Serial.println();\n  }\n}\n\nvoid setup() {\n  Serial.begin(115200);\n\
    \  while (!Serial) { delay(10); }\n\n  // Configure I2S for ADC reading via DMA\n  i2s_config_t i2s_config = {\n    .mode = (i2s_mode_t)(I2S_MODE_MASTER | I2S_MODE_RX | I2S_MODE_ADC_BUILT_IN),\n   \
    \ .sample_rate = SAMPLE_RATE,\n    .bits_per_sample = I2S_BITS_PER_SAMPLE_16BIT,\n    .channel_format = I2S_CHANNEL_FMT_ONLY_LEFT,\n    .communication_format = I2S_COMM_FORMAT_STAND_I2S,\n    .intr_alloc_flags\
    \ = ESP_INTR_FLAG_LEVEL1,\n    .dma_buf_count = 4,\n    .dma_buf_len = BUFFER_SAMPLES,\n    .use_apll = false\n  };\n\n  i2s_driver_install(I2S_NUM_0, &i2s_config, 0, NULL);\n  i2s_set_adc_mode(ADC_UNIT_1,\
    \ ADC1_CHANNEL_0);\n  i2s_adc_enable(I2S_NUM_0);\n\n  xTaskCreatePinnedToCore(processTask, \"Process\", 4096, NULL, 2, &processTaskHandle, 1);\n\n  Serial.print(\"DMA ADC active: \"); Serial.print(SAMPLE_RATE);\
    \ Serial.print(\" Hz, \"); Serial.print(BUFFER_SAMPLES); Serial.println(\" samples/buffer\");\n}\n\nvoid loop() {\n  size_t bytesRead;\n  i2s_read(I2S_NUM_0, adcBuffer, sizeof(adcBuffer), &bytesRead,\
    \ portMAX_DELAY);\n}\n"
