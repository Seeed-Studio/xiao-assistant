  code: "// Hardware Interrupts - XIAO ESP32/RP2040\n// Demonstrates rising, falling, and change edge interrupts\n#define ENCODER_A 2   // Rotary encoder pin A\n#define ENCODER_B 3   // Rotary encoder pin\
    \ B\n#define BUTTON_PIN 0  // Push button\n\nvolatile long encoderCount = 0;\nvolatile bool buttonPressed = false;\nvolatile unsigned long lastInterruptTime = 0;\n\n// Encoder ISR - fires on pin A rising\
    \ edge\nvoid IRAM_ATTR encoderISR() {\n  unsigned long now = micros();\n  if (now - lastInterruptTime < 500) return;  // Debounce 500us\n  lastInterruptTime = now;\n\n  if (digitalRead(ENCODER_B)) {\n\
    \    encoderCount--;\n  } else {\n    encoderCount++;\n  }\n}\n\n// Button ISR - fires on falling edge (button press)\nvoid IRAM_ATTR buttonISR() {\n  buttonPressed = true;\n}\n\nvoid setup() {\n  Serial.begin(115200);\n\
    \  while (!Serial) { delay(10); }\n\n  pinMode(ENCODER_A, INPUT_PULLUP);\n  pinMode(ENCODER_B, INPUT_PULLUP);\n  pinMode(BUTTON_PIN, INPUT_PULLUP);\n\n  // Attach interrupts\n  attachInterrupt(digitalPinToInterrupt(ENCODER_A),\
    \ encoderISR, RISING);\n  attachInterrupt(digitalPinToInterrupt(BUTTON_PIN), buttonISR, FALLING);\n\n  Serial.println(\"Hardware Interrupt Example\");\n  Serial.println(\"Rotate encoder or press button\
    \ on pin 0\");\n}\n\nvoid loop() {\n  static long lastCount = 0;\n  static unsigned long lastPrint = 0;\n\n  if (millis() - lastPrint > 200) {\n    lastPrint = millis();\n    if (encoderCount != lastCount)\
    \ {\n      Serial.print(\"Encoder: \"); Serial.print(encoderCount); Serial.println();\n      lastCount = encoderCount;\n    }\n  }\n\n  if (buttonPressed) {\n    Serial.println(\"Button pressed! Resetting\
    \ encoder.\");\n    encoderCount = 0;\n    buttonPressed = false;\n  }\n}\n"
