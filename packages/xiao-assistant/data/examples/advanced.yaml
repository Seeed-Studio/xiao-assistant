  code: "// Watchdog Timer - XIAO ESP32 Series\n// Resets the board if the loop hangs for too long\n#include <esp_task_wdt.h>\n\n#define WDT_TIMEOUT 5  // Watchdog timeout in seconds\n\nbool simulateHang\
    \ = false;\nunsigned long hangStart = 0;\n\nvoid setup() {\n  Serial.begin(115200);\n  delay(1000);\n\n  // Initialize watchdog with panic handler\n  esp_task_wdt_init(WDT_TIMEOUT, true);\n  esp_task_wdt_add(NULL);\
    \  // Add current task (loop task)\n\n  Serial.print(\"Watchdog started with \"); Serial.print(WDT_TIMEOUT); Serial.println(\" second timeout\"); Serial.println(\"System will reset if loop() doesn't\
    \ feed the watchdog\");\n}\n\nvoid loop() {\n  Serial.print(\"Running... (uptime: \"); Serial.print(millis() / 1000);  Serial.println(\" s)\");\n\n  // Simulate a hang after 15 seconds\n  if (millis()\
    \ > 15000 && !simulateHang) {\n    simulateHang = true;\n    Serial.println(\"Simulating hang! Watchdog will reset the board...\");\n  }\n\n  if (simulateHang) {\n    // Intentionally hang - do NOT\
    \ feed the watchdog\n    while (true) {\n      delay(1000);\n    }\n  }\n\n  // Feed the watchdog to prevent reset\n  esp_task_wdt_reset();\n  delay(1000);\n}\n"
  requirements: []
  wikiUrl: https://wiki.seeedstudio.com/XIAO_ESP32C3_Getting_Started/
