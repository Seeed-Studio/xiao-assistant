- id: ble-uart-arduino
  title: BLE UART Service
  description: Create a BLE UART service for bidirectional serial communication
  language: arduino
  boards:
  - nrf52840
  - nrf52840-sense
  - samd21
  - ra4m1
  category: communication
  tags:
