  code: "// BLE iBeacon - XIAO nRF52840\n#include <ArduinoBLE.h>\n\n// iBeacon UUID (change to your own)\nconst char* beaconUUID = \"E2C56DB5-DFFB-48D2-B060-D0F5A71096E0\";\nuint16_t major = 1;\nuint16_t\
    \ minor = 1;\nint8_t txPower = -59;  // Measured TX power at 1 meter\n\nBLEService beaconService(\"180A\");  // Device Information Service\n\nvoid setup() {\n  Serial.begin(115200);\n  while (!Serial)\
    \ { delay(10); }\n\n  if (!BLE.begin()) {\n    Serial.println(\"Starting BLE failed!\");\n    while (1);\n  }\n\n  // Build iBeacon manufacturer data\n  uint8_t beaconData[25];\n  beaconData[0] = 0x02;\
    \ beaconData[1] = 0x15;  // iBeacon prefix\n  // Parse UUID string into bytes\n  uint8_t uuid[16];\n  sscanf(beaconUUID, \"%2hhx%2hhx%2hhx%2hhx-%2hhx%2hhx-%2hhx%2hhx-%2hhx%2hhx-%2hhx%2hhx%2hhx%2hhx%2hhx%2hhx\"\
    ,\n    &uuid[0], &uuid[1], &uuid[2], &uuid[3], &uuid[4], &uuid[5], &uuid[6], &uuid[7],\n    &uuid[8], &uuid[9], &uuid[10], &uuid[11], &uuid[12], &uuid[13], &uuid[14], &uuid[15]);\n  memcpy(&beaconData[2],\
    \ uuid, 16);\n  beaconData[18] = major >> 8; beaconData[19] = major & 0xFF;\n  beaconData[20] = minor >> 8; beaconData[21] = minor & 0xFF;\n  beaconData[22] = txPower;\n\n  BLE.setManufacturerData(beaconData,\
    \ 23);\n  BLE.setLocalName(\"XIAO-iBeacon\");\n\n  BLE.advertise();\n  Serial.println(\"iBeacon advertising...\");\n  Serial.print(\"UUID: \"); Serial.print(beaconUUID); Serial.print(\"\\nMajor: \"\
    ); Serial.print(major); Serial.print(\", Minor: \"); Serial.print(minor); Serial.println()\n}\n\nvoid loop() {\n  // iBeacon just advertises; no connections needed\n  delay(1000);\n}\n"
  requirements:
  - ArduinoBLE
  wikiUrl: https://wiki.seeedstudio.com/XIAO-BLE-Sense-Getting-Started/
