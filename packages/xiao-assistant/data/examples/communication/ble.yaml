  code: "// BLE Server - XIAO ESP32 Series\n// Uses ESP32 NimBLE stack (no extra library needed)\n#include <BLEDevice.h>\n#include <BLEServer.h>\n#include <BLEUtils.h>\n#include <BLE2902.h>\n\n#define SERVICE_UUID\
    \        \"4fafc201-1fb5-459e-8fcc-c5c9c331914b\"\n#define CHARACTERISTIC_UUID \"beb5483e-36e1-4688-b7f5-ea07361b26a8\"\n\nBLEServer* pServer = nullptr;\nBLECharacteristic* pCharacteristic = nullptr;\n\
    bool deviceConnected = false;\n\nclass MyServerCallbacks : public BLEServerCallbacks {\n  void onConnect(BLEServer* pServer) {\n    deviceConnected = true;\n    Serial.println(\"Client connected\");\n\
    \  }\n  void onDisconnect(BLEServer* pServer) {\n    deviceConnected = false;\n    Serial.println(\"Client disconnected\");\n    pServer->getAdvertising()->start();\n  }\n};\n\nvoid setup() {\n  Serial.begin(115200);\n\
    \  while (!Serial) { delay(10); }\n\n  BLEDevice::init(\"XIAO-ESP32\");\n  pServer = BLEDevice::createServer();\n  pServer->setCallbacks(new MyServerCallbacks());\n\n  BLEService* pService = pServer->createService(SERVICE_UUID);\n\
    \  pCharacteristic = pService->createCharacteristic(\n    CHARACTERISTIC_UUID,\n    BLECharacteristic::PROPERTY_READ |\n    BLECharacteristic::PROPERTY_WRITE |\n    BLECharacteristic::PROPERTY_NOTIFY\n\
    \  );\n  pCharacteristic->addDescriptor(new BLE2902());\n  pCharacteristic->setValue(\"Hello from XIAO\");\n\n  pService->start();\n  BLEAdvertising* pAdvertising = BLEDevice::getAdvertising();\n  pAdvertising->addServiceUUID(SERVICE_UUID);\n\
    \  pAdvertising->start();\n\n  Serial.println(\"BLE server advertising...\");\n}\n\nvoid loop() {\n  if (deviceConnected) {\n    static unsigned long lastUpdate = 0;\n    if (millis() - lastUpdate >\
    \ 2000) {\n      lastUpdate = millis();\n      String value = \"Time: \" + String(millis() / 1000) + \"s\";\n      pCharacteristic->setValue(value.c_str());\n      pCharacteristic->notify();\n     \
    \ Serial.println(\"Sent: \" + value);\n    }\n  }\n  delay(10);\n}\n"
  requirements: []
  wikiUrl: https://wiki.seeedstudio.com/XIAO_ESP32C3_Getting_Started/
