  code: "// BLE Sensor Broadcast - XIAO nRF52840 Sense\n// Advertise temperature and humidity without connection\n#include <ArduinoBLE.h>\n\n// Custom service UUID\nBLEService sensorService(\"181A\"); \
    \ // Environmental Sensing\nBLEFloatCharacteristic tempChar(\"2A6E\", BLERead | BLENotify);\nBLEFloatCharacteristic humidChar(\"2A6F\", BLERead | BLENotify);\n\n// Simulated sensor readings (replace\
    \ with real sensors)\nfloat readTemperature() { return 22.5 + random(-20, 20) / 10.0; }\nfloat readHumidity() { return 55.0 + random(-100, 100) / 10.0; }\n\nvoid setup() {\n  Serial.begin(115200);\n\
    \  while (!Serial) { delay(10); }\n\n  if (!BLE.begin()) {\n    Serial.println(\"BLE init failed!\");\n    while (1);\n  }\n\n  BLE.setLocalName(\"XIAO-Sensor\");\n  BLE.setAdvertisedService(sensorService);\n\
    \  sensorService.addCharacteristic(tempChar);\n  sensorService.addCharacteristic(humidChar);\n  BLE.addService(sensorService);\n\n  BLE.advertise();\n  Serial.println(\"BLE sensor broadcast active\"\
    );\n}\n\nvoid loop() {\n  float temp = readTemperature();\n  float humid = readHumidity();\n\n  tempChar.writeValue(temp);\n  humidChar.writeValue(humid);\n\n  Serial.print(\"Broadcasting: \"); Serial.print(temp,\
    \ 1); Serial.print(\" C, \"); Serial.print(humid, 1); Serial.print(\" \"); Serial.print(\"%\"); Serial.println()\n  delay(5000);\n}\n"
  requirements:
  - ArduinoBLE
  wikiUrl: https://wiki.seeedstudio.com/XIAO-BLE-Sense-Getting-Started/
