- id: wifi-scan-arduino
  title: WiFi Network Scan
  description: Scan for available WiFi networks in range
  language: arduino
  boards:
  - esp32c3
  - esp32s3
  - esp32s3-sense
  - esp32c6
  category: communication
  tags:
  - wifi
  - scan
  - network
  - ssid
  - discovery
  code: "// WiFi Scan - XIAO ESP32 Series\n#include <WiFi.h>\n\nvoid setup() {\n  Serial.begin(115200);\n  while (!Serial) { delay(10); }\n\n  // Set WiFi to station mode\n  WiFi.mode(WIFI_STA);\n  WiFi.disconnect();\n\
    \  delay(100);\n\n  Serial.println(\"WiFi Scan started\");\n}\n\nvoid loop() {\n  Serial.println(\"Scanning...\");\n\n  int networkCount = WiFi.scanNetworks();\n\n  if (networkCount == 0) {\n    Serial.println(\"\
    No networks found\");\n  } else {\n    Serial.print(networkCount); Serial.println(\" networks found:\");\n    for (int i = 0; i < networkCount; i++) {\n      Serial.print(i + 1); Serial.print(\": \"\
    ); Serial.print(WiFi.SSID(i).c_str());  Serial.print(\" (RSSI: \"); Serial.print(WiFi.RSSI(i));  Serial.print(\") \"); Serial.print(WiFi.encryptionType(i) == WIFI_AUTH_OPEN ? \"(Open)\" : \"(Encrypted)\"\
    );  Serial.println();\n    }\n  }\n  Serial.println(\"\");\n  delay(5000);\n}\n"
  requirements: []
  wikiUrl: https://wiki.seeedstudio.com/XIAO_ESP32C3_Getting_Started/
