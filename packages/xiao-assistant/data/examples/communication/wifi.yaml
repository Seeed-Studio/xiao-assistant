  code: "// Simple HTTP Server - XIAO ESP32 Series\n#include <WiFi.h>\n#include <WebServer.h>\n\nconst char* ssid = \"YOUR_SSID\";\nconst char* password = \"YOUR_PASSWORD\";\n\nWebServer server(80);\nbool\
    \ ledState = false;\n\nvoid handleRoot() {\n  String html = \"<!DOCTYPE html><html><head><meta name='viewport' content='width=device-width, initial-scale=1'>\";\n  html += \"<title>XIAO LED Control</title></head><body><h1>XIAO\
    \ LED Control</h1>\";\n  html += \"<p>LED is now: <strong>\" + String(ledState ? \"ON\" : \"OFF\") + \"</strong></p>\";\n  html += \"<a href='/on'><button>Turn ON</button></a> \";\n  html += \"<a href='/off'><button>Turn\
    \ OFF</button></a></body></html>\";\n  server.send(200, \"text/html\", html);\n}\n\nvoid handleOn() {\n  ledState = true;\n  digitalWrite(LED_BUILTIN, HIGH);\n  server.sendHeader(\"Location\", \"/\"\
    );\n  server.send(303);\n}\n\nvoid handleOff() {\n  ledState = false;\n  digitalWrite(LED_BUILTIN, LOW);\n  server.sendHeader(\"Location\", \"/\");\n  server.send(303);\n}\n\nvoid setup() {\n  Serial.begin(115200);\n\
    \  pinMode(LED_BUILTIN, OUTPUT);\n\n  WiFi.begin(ssid, password);\n  while (WiFi.status() != WL_CONNECTED) {\n    delay(500);\n    Serial.print(\".\");\n  }\n  Serial.println(\"\\nConnected! IP: \"\
    \ + WiFi.localIP().toString());\n\n  server.on(\"/\", handleRoot);\n  server.on(\"/on\", handleOn);\n  server.on(\"/off\", handleOff);\n  server.begin();\n}\n\nvoid loop() {\n  server.handleClient();\n\
    }\n"
