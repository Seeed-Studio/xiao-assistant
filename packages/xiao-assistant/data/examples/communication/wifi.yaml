  - rest
  - api
  code: "// HTTP Client GET Request - XIAO ESP32 Series\n#include <WiFi.h>\n#include <HTTPClient.h>\n\nconst char* ssid = \"YOUR_SSID\";\nconst char* password = \"YOUR_PASSWORD\";\n\nvoid setup() {\n  Serial.begin(115200);\n\
    \  while (!Serial) { delay(10); }\n\n  WiFi.begin(ssid, password);\n  while (WiFi.status() != WL_CONNECTED) {\n    delay(500);\n    Serial.print(\".\");\n  }\n  Serial.println(\"\\nWiFi connected\"\
    );\n}\n\nvoid loop() {\n  if (WiFi.status() == WL_CONNECTED) {\n    HTTPClient http;\n    http.begin(\"http://worldtimeapi.org/api/timezone/Etc/UTC\");\n    http.setTimeout(5000);\n\n    int httpCode\
    \ = http.GET();\n\n    if (httpCode > 0) {\n      Serial.print(\"HTTP Response: \"); Serial.print(httpCode); Serial.println();\n      String payload = http.getString();\n      Serial.println(payload);\n\
    \    } else {\n      Serial.print(\"HTTP request failed: \"); Serial.print(http.errorToString(httpCode).c_str());  Serial.println();\n    }\n\n    http.end();\n  } else {\n    Serial.println(\"WiFi\
    \ not connected\");\n  }\n\n  delay(10000);\n}\n"
