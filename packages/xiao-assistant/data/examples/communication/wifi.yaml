  code: "// WiFi Access Point Mode - XIAO ESP32 Series\n#include <WiFi.h>\n#include <WebServer.h>\n\nconst char* apSSID = \"XIAO-AP\";\nconst char* apPassword = \"xiao1234\";  // Min 8 characters\n\nWebServer\
    \ server(80);\nint clientCount = 0;\n\nvoid handleRoot() {\n  String html = \"<!DOCTYPE html><html><body>\";\n  html += \"<h1>XIAO Access Point</h1>\";\n  html += \"<p>Connected clients: \" + String(WiFi.softAPgetStationNum())\
    \ + \"</p>\";\n  html += \"<p>AP IP: \" + WiFi.softAPIP().toString() + \"</p>\";\n  html += \"</body></html>\";\n  server.send(200, \"text/html\", html);\n}\n\nvoid setup() {\n  Serial.begin(115200);\n\
    \  while (!Serial) { delay(10); }\n\n  WiFi.mode(WIFI_AP);\n  WiFi.softAP(apSSID, apPassword);\n\n  Serial.println(\"Access Point started\");\n  Serial.print(\"SSID: \"); Serial.print(apSSID); Serial.println();\
    \ \n  Serial.print(\"IP: \"); Serial.print(WiFi.softAPIP().toString().c_str());  Serial.println();\n\n  server.on(\"/\", handleRoot);\n  server.begin();\n}\n\nvoid loop() {\n  server.handleClient();\n\
    \n  int currentCount = WiFi.softAPgetStationNum();\n  if (currentCount != clientCount) {\n    clientCount = currentCount;\n    Serial.print(\"Connected clients: \"); Serial.print(clientCount); Serial.println();\n\
    \  }\n}\n"
