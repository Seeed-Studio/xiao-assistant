- id: wifi-reconnect-arduino
  title: WiFi Auto-Reconnect
  description: Connect to WiFi with automatic reconnection and exponential backoff
  language: arduino
  boards:
  - esp32c3
  - esp32s3
  - esp32s3-sense
  - esp32c6
  category: communication
  tags:
  - wifi
  - reconnect
  - robust
  - connection
  - resilience
  code: "// WiFi Auto-Reconnect with Exponential Backoff - XIAO ESP32\n#include <WiFi.h>\n\nconst char* ssid = \"YOUR_SSID\";\nconst char* password = \"YOUR_PASSWORD\";\n\nunsigned long lastAttempt = 0;\n\
    int retryDelay = 1000;       // Start with 1 second\nint maxRetryDelay = 60000;   // Max 60 seconds between retries\nbool wasConnected = false;\n\nvoid connectToWiFi() {\n  Serial.print(\"Connecting\
    \ to \"); Serial.print(ssid); Serial.println(\"...\");\n  WiFi.disconnect();\n  WiFi.begin(ssid, password);\n  lastAttempt = millis();\n}\n\nvoid setup() {\n  Serial.begin(115200);\n  while (!Serial)\
    \ { delay(10); }\n\n  WiFi.setAutoReconnect(false); // We handle reconnection manually\n  connectToWiFi();\n}\n\nvoid loop() {\n  if (WiFi.status() == WL_CONNECTED) {\n    if (!wasConnected) {\n   \
    \   Serial.print(\"Connected! IP: \"); Serial.print(WiFi.localIP().toString().c_str());  Serial.println();\n      retryDelay = 1000; // Reset backoff on successful connection\n      wasConnected = true;\n\
    \    }\n  } else {\n    if (wasConnected) {\n      Serial.println(\"Connection lost!\");\n      wasConnected = false;\n    }\n    // Exponential backoff reconnection\n    if (millis() - lastAttempt\
    \ > (unsigned long)retryDelay) {\n      Serial.print(\"Reconnecting (retry delay: \"); Serial.print(retryDelay); Serial.println(\" ms)...\");\n      connectToWiFi();\n      retryDelay = min(retryDelay\
    \ * 2, maxRetryDelay);\n    }\n  }\n  delay(100);\n}\n"
  requirements: []
  wikiUrl: https://wiki.seeedstudio.com/XIAO_ESP32C3_Getting_Started/
